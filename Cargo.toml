[package]
name = "sweet-server"
version = "0.1.0"
edition = "2021"
description = "A Federated Wiki server in Rust — Phase 2: read-only. Conformance-tested against wiki-server 0.27.0."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
regex = "1"
ureq = { version = "2", default-features = false }
multer = "3"
futures-util = { version = "0.3", default-features = false }
bytes = "1"
getrandom = "0.2"

[profile.release]
strip = true
lto = true
