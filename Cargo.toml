[package]
name = "sweet-server"
version = "0.1.0"
edition = "2021"
description = "A Federated Wiki server in Rust — Phase 2: read-only. Conformance-tested against wiki-server 0.27.0."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
multer = "3"
futures-util = { version = "0.3", default-features = false }
bytes = "1"
getrandom = "0.2"
openidconnect = "4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
sha1 = "0.10"
oneclick-core = { path = "../oneclick-orgs/core" }
similarity-core = { path = "../similarity-core" }

[profile.release]
strip = true
lto = true
